name: Node.js CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Reisetagebuch-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: Reisetagebuch-Frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
